[project]
name = "basshopper-helper"
version = "0.1.0"
description = "BassHopper local helper: Guitar Pro import, stems, song library"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.0",
    "mutagen>=1.48.1",
    "numpy>=2.5.4",
    "pyguitarpro>=0.11",
    "python-multipart>=0.0.32",
    "soundfile>=0.14.0",
    "uvicorn[standard]>=0.54.0",
]

[project.optional-dependencies]
stems = ["demucs>=4.0.1"]

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
